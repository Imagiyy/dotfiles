config_version = 14

[bar.default]
auto_hide = true
center = [ "clock", "date", "sysmon", "notifications", "status", "notes" ]
end = [ "clipboard", "network", "bluetooth", "volume", "battery", "control-center", "session" ]
layer = "overlay"
margin_ends = 0
padding = 0
radius = 0
reserve_space = false
scale = 0.80000000447034836
shadow = false
show_on_workspace_switch = false
start = [ "launcher", "wallpaper", "workspaces", "taskbar" ]
thickness = 28

[battery]
warning_threshold = 20

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hot_corners]
delay_ms = 150

    [hot_corners.bottom_left]
    action = "launcher"

    [hot_corners.bottom_right]
    action = "launcher"

    [hot_corners.top_left]
    action = "launcher"

    [hot_corners.top_right]
    action = "launcher"

[idle]
pre_action_fade_seconds = 30

[lockscreen]
enabled = true
wallpaper = "/home/abrar/Downloads/grub-of-tsushima/grub-of-tsushima-black/got_1920x1080.png"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 128.0
    box_width = 810.0
    cx = 640.00006103515625
    cy = 470.0
    output = "eDP-1"
    placement_height = 720.0
    placement_width = 1280.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "primary"
        background_opacity = 0.0
        background_radius = 0.0
        center_password_text = false
        input_opacity = 0.47999999999999998
        input_radius = 32.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 640.00006103515625
    cy = 184.00001525878906
    output = "eDP-1"
    placement_height = 720.0
    placement_width = 1280.0
    rotation = 0.0
    type = "clock"

[plugins]
enabled = [ "nightwatch75/todo", "aristides/udiskie", "noctalia/notes" ]

[shell]
avatar_path = "/home/abrar/Pictures/wallpapers/wp5497745-khana-kaba-hd-desktop-wallpapers.jpg"
screen_time_enabled = true

    [shell.animation]
    speed = 1.8000000268220901

    [shell.screen_corners]
    size = 1

    [shell.screenshot]
    show_cursor = true

[system.monitor]
disk_used_activity_threshold = 67
disk_used_pct_activity_threshold = 64
net_rx_critical_threshold = 100.0
net_tx_critical_threshold = 100.0

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
custom_palette = "noctalia-wallpaper-mc"
mode = "dark"
pure_black_dark = true
source = "custom"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/abrar/Pictures/wallpapers"
transition_duration = 100

    [wallpaper.automation]
    enabled = true
    interval_seconds = 20

    [wallpaper.default]
    path = "/home/abrar/Pictures/wallpapers/8c7d1e5c-0739-4b09-b35c-66203b2595c1.png"

    [wallpaper.last]
    path = "/home/abrar/Pictures/wallpapers/8c7d1e5c-0739-4b09-b35c-66203b2595c1.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/abrar/Pictures/wallpapers/8c7d1e5c-0739-4b09-b35c-66203b2595c1.png"

[widget.notes]
type = "noctalia/notes:notes"

[widget.status]
type = "aristides/udiskie:status"

[widget.taskbar]
only_active_workspace = true
show_window_title = false